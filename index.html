<!DOCTYPE html>
<html>
<head>
  <title>ESP32 BLE Robot Controller</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <style>
    body { font-family: Arial; text-align: center; margin-top: 20px; background-color: #222; color: white;}
    .connect-container { margin-bottom: 20px; }
    .connect-btn { background-color: #ffc107; color: black; border: none; padding: 12px 30px; font-size: 18px; font-weight: bold; border-radius: 5px; cursor: pointer; }
    .connect-btn.connected { background-color: #28a745; color: white; }
    .tab-container { display: flex; justify-content: center; gap: 5px; margin-bottom: 20px; flex-wrap: wrap; }
    .tab-btn { background-color: #444; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; }
    .tab-btn.active { background-color: #007BFF; font-weight: bold; }
    .tab-content { display: none; padding: 20px; background-color: #333; border-radius: 10px; margin: 0 auto; max-width: 400px; }
    .tab-content.active { display: block; }
    
    /* Button Grid Styles */
    .grid-container { display: grid; grid-template-columns: repeat(3, 80px); gap: 10px; justify-content: center; margin-top: 20px;}
    .btn { background-color: #007BFF; color: white; border: none; border-radius: 10px; font-size: 24px; font-weight: bold; width: 80px; height: 80px; user-select: none; touch-action: manipulation;}
    .btn:active { background-color: #0056b3; }
    .empty { visibility: hidden; }
    
    /* Joystick Styles */
    .joystick-container { display: flex; justify-content: center; margin: 25px 0; touch-action: none; }
    .joystick-base { width: 160px; height: 160px; background-color: #444; border-radius: 50%; position: relative; box-shadow: inset 0 0 15px rgba(0,0,0,0.8); }
    .joystick-stick { width: 70px; height: 70px; background-color: #007BFF; border-radius: 50%; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); cursor: pointer; box-shadow: 0 4px 8px rgba(0,0,0,0.5); transition: transform 0.1s ease-out; }
    .joystick-stick.active { transition: none; background-color: #0056b3;}

    .sensor-row { display: flex; justify-content: space-around; margin: 20px 0; font-size: 18px;}
    .ir-indicator { width: 50px; height: 50px; border-radius: 25px; background-color: gray; line-height: 50px; color: black; font-weight: bold; margin: 5px auto;}
    .input-group { margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
    .input-group input { width: 60px; padding: 5px; font-size: 16px; text-align: center; }
    .update-btn { background-color: #28a745; color: white; border: none; padding: 5px 15px; border-radius: 5px; font-size: 16px; cursor: pointer;}
  </style>
  
  <script>
    const SERVICE_UUID           = "19b10000-e8f2-537e-4f6c-d104768a1214";
    const CHARACTERISTIC_UUID_RX = "19b10001-e8f2-537e-4f6c-d104768a1214"; 
    const CHARACTERISTIC_UUID_TX = "19b10002-e8f2-537e-4f6c-d104768a1214"; 

    let bleDevice = null;
    let rxCharacteristic = null; 
    let driveInterval = null;    

    async function connectBluetooth() {
      const connectBtn = document.getElementById('connect-btn');
      try {
        console.log("Requesting Bluetooth Device...");
        bleDevice = await navigator.bluetooth.requestDevice({
          filters: [{ name: 'ESP32_Robot' }],
          optionalServices: [SERVICE_UUID]
        });

        console.log("Connecting to GATT Server...");
        const server = await bleDevice.gatt.connect();

        console.log("Getting primary BLE Service...");
        const service = await server.getPrimaryService(SERVICE_UUID);

        console.log("Getting Characteristics...");
        rxCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID_RX);
        const txCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID_TX);

        await txCharacteristic.startNotifications();
        txCharacteristic.addEventListener('characteristicvaluechanged', handleIncomingSensors);

        connectBtn.innerText = "Connected";
        connectBtn.classList.add('connected');
        console.log("BLE Connection Successful!");

        bleDevice.addEventListener('gattserverdisconnected', () => {
          connectBtn.innerText = "Pair Robot";
          connectBtn.classList.remove('connected');
          alert("Bluetooth Disconnected!");
        });

      } catch (error) {
        console.error("Bluetooth Setup Failed: ", error);
        alert("Connection Failed. Check ESP32 power and browser compatibility.");
      }
    }

    function sendBLECommand(cmdString) {
      if (!rxCharacteristic) return;
      let encoder = new TextEncoder();
      rxCharacteristic.writeValue(encoder.encode(cmdString))
        .catch(err => console.error("BLE Write error: ", err));
    }

    function startDriving(cmdChar) {
      if (driveInterval) return; 
      
      sendBLECommand(cmdChar + "\n"); 
      driveInterval = setInterval(() => {
        sendBLECommand(cmdChar + "\n");
      }, 100);
    }

    function stopDriving() {
      if (driveInterval) {
        clearInterval(driveInterval);
        driveInterval = null;
        sendBLECommand("S\n"); 
      }
    }

    function switchMode(mode) {
      if (driveInterval) {
        clearInterval(driveInterval);
        driveInterval = null;
      }

      if(mode === 'manual') sendBLECommand("m\n");
      if(mode === 'line')   sendBLECommand("l\n");
      if(mode === 'wall')   sendBLECommand("w\n");

      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      
      document.getElementById('content-' + mode).classList.add('active');
      document.getElementById('btn-' + mode).classList.add('active');
    }

    document.addEventListener("mouseup", stopDriving);
    document.addEventListener("touchend", stopDriving);

    function updateVariable(paramName, inputId) {
      let val = document.getElementById(inputId).value;
      let payload = "";

      if (paramName === "m_speedl")    payload = "VL" + val + "\n";
      if (paramName === "m_speedr")    payload = "VR" + val + "\n";
      if (paramName === "line_turn")   payload = "T" + val + "\n";
      if (paramName === "wall_target") payload = "G" + val + "\n";
      if (paramName === "wall_speed")  payload = "Z" + val + "\n";

      sendBLECommand(payload);
    }

    function handleIncomingSensors(event) {
      let decoder = new TextDecoder('utf-8');
      let incomingString = decoder.decode(event.target.value);
      let data = incomingString.split(',');
      
      if (data.length >= 6) {
        let irL = parseInt(data[0]);
        let irC = parseInt(data[1]);
        let irR = parseInt(data[2]);
        
        document.getElementById('ir-left').style.backgroundColor = irL ? "white" : "black";
        document.getElementById('ir-center').style.backgroundColor = irC ? "white" : "black";
        document.getElementById('ir-right').style.backgroundColor = irR ? "white" : "black";

        document.getElementById('us-left').innerText = data[3] + " cm";
        document.getElementById('us-front').innerText = data[4] + " cm";
        document.getElementById('us-right').innerText = data[5] + " cm";
      }
    }

    // --- JOYSTICK LOGIC ---
    let joystickActive = false;
    let currentJoyCmd = null;

    document.addEventListener("DOMContentLoaded", () => {
      const base = document.getElementById('joy-base');
      const stick = document.getElementById('joy-stick');
      const maxRadius = base.offsetWidth / 2 - stick.offsetWidth / 2;

      const handleStart = (e) => {
        joystickActive = true;
        stick.classList.add('active');
        handleMove(e);
      };

      const handleMove = (e) => {
        if (!joystickActive) return;
        if (e.cancelable) e.preventDefault(); // Prevent scrolling on touch devices

        let rect = base.getBoundingClientRect();
        let centerX = rect.left + rect.width / 2;
        let centerY = rect.top + rect.height / 2;

        let clientX = e.touches ? e.touches[0].clientX : e.clientX;
        let clientY = e.touches ? e.touches[0].clientY : e.clientY;

        let dx = clientX - centerX;
        let dy = clientY - centerY;
        let distance = Math.sqrt(dx * dx + dy * dy);

        // Constrain stick to the base
        if (distance > maxRadius) {
          dx = (dx / distance) * maxRadius;
          dy = (dy / distance) * maxRadius;
          distance = maxRadius;
        }

        // Move the stick visually
        stick.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;

        // Calculate command based on angle
        let newCmd = null;
        if (distance > 20) { // Deadzone (ignore slight touches)
          let angle = Math.atan2(dy, dx) * (180 / Math.PI);
          
          if (angle > -45 && angle <= 45) newCmd = 'R';
          else if (angle > 45 && angle <= 135) newCmd = 'D';
          else if (angle > -135 && angle <= -45) newCmd = 'U';
          else newCmd = 'L';
        }

        // Send command only if it changed
        if (newCmd !== currentJoyCmd) {
          stopDriving(); 
          if (newCmd) {
            startDriving(newCmd);
          }
          currentJoyCmd = newCmd;
        }
      };

      const handleEnd = () => {
        if (!joystickActive) return;
        joystickActive = false;
        stick.classList.remove('active');
        stick.style.transform = `translate(-50%, -50%)`; // Snap back to center
        stopDriving();
        currentJoyCmd = null;
      };

      // Mouse Events
      base.addEventListener('mousedown', handleStart);
      document.addEventListener('mousemove', handleMove);
      document.addEventListener('mouseup', handleEnd);

      // Touch Events
      base.addEventListener('touchstart', handleStart, { passive: false });
      document.addEventListener('touchmove', handleMove, { passive: false });
      document.addEventListener('touchend', handleEnd);
    });
  </script>
</head>
<body>
  <h2>Robot Control Panel</h2>

  <div class="connect-container">
    <button id="connect-btn" class="connect-btn" onclick="connectBluetooth()">Pair Robot</button>
  </div>
  
  <div class="tab-container">
    <button id="btn-manual" class="tab-btn active" onclick="switchMode('manual')">Manual</button>
    <button id="btn-line" class="tab-btn" onclick="switchMode('line')">Line Tracing</button>
    <button id="btn-wall" class="tab-btn" onclick="switchMode('wall')">Wall Following</button>
  </div>

  <div id="content-manual" class="tab-content active">
    <p>Press buttons or use joystick</p>
    
    <div class="grid-container">
      <div class="empty"></div>
      <button class="btn" onmousedown="startDriving('U')" ontouchstart="startDriving('U')">W</button>
      <div class="empty"></div>
      <button class="btn" onmousedown="startDriving('L')" ontouchstart="startDriving('L')">A</button>
      <button class="btn" onmousedown="startDriving('D')" ontouchstart="startDriving('D')">S</button>
      <button class="btn" onmousedown="startDriving('R')" ontouchstart="startDriving('R')">D</button>
    </div>

    <div class="joystick-container">
      <div id="joy-base" class="joystick-base">
        <div id="joy-stick" class="joystick-stick"></div>
      </div>
    </div>

    <hr>
    <h3>Tuning Variables</h3>
    <div class="input-group">
      <label>Base Speed Left:</label>
      <input type="number" id="b_speedl_m" value="175">
      <button class="update-btn" onclick="updateVariable('m_speedl', 'b_speedl_m')">Set</button>
    </div>
    <div class="input-group">
      <label>Base Speed Right:</label>
      <input type="number" id="b_speedr_m" value="217">
      <button class="update-btn" onclick="updateVariable('m_speedr', 'b_speedr_m')">Set</button>
    </div>
  </div>

  <div id="content-line" class="tab-content">
    <h3>IR Sensor Status</h3>
    <div class="sensor-row">
      <div>Left<br><div id="ir-left" class="ir-indicator"></div></div>
      <div>Center<br><div id="ir-center" class="ir-indicator"></div></div>
      <div>Right<br><div id="ir-right" class="ir-indicator"></div></div>
    </div>
    <hr>
    <h3>Tuning Variables</h3>
    <div class="input-group">
      <label>Base Speed Left:</label>
      <input type="number" id="b_speedl_l" value="175">
      <button class="update-btn" onclick="updateVariable('m_speedl', 'b_speedl_l')">Set</button>
    </div>
    <div class="input-group">
      <label>Base Speed Right:</label>
      <input type="number" id="b_speedr_l" value="217">
      <button class="update-btn" onclick="updateVariable('m_speedr', 'b_speedr_l')">Set</button>
    </div>
    <div class="input-group">
      <label>Turn Sharpness:</label>
      <input type="number" id="lt-turn" value="27">
      <button class="update-btn" onclick="updateVariable('line_turn', 'lt-turn')">Set</button>
    </div>
  </div>

  <div id="content-wall" class="tab-content">
    <h3>Ultrasonic Distances</h3>
    <div class="sensor-row">
      <div>Left<br><span id="us-left" style="font-weight:bold; color:#007BFF;">-- cm</span></div>
      <div>Front<br><span id="us-front" style="font-weight:bold; color:#007BFF;">-- cm</span></div>
      <div>Right<br><span id="us-right" style="font-weight:bold; color:#007BFF;">-- cm</span></div>
    </div>
    <hr>
    <h3>Tuning Variables</h3>
    <div class="input-group">
      <label>Target Distance (cm):</label>
      <input type="number" id="wf-dist" value="15">
      <button class="update-btn" onclick="updateVariable('wall_target', 'wf-dist')">Set</button>
    </div>
    <div class="input-group">
      <label>Max Speed (0-255):</label>
      <input type="number" id="wf-speed" value="120">
      <button class="update-btn" onclick="updateVariable('wall_speed', 'wf-speed')">Set</button>
    </div>
  </div>
</body>
</html>
